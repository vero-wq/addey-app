   heading above them; they're told apart by their own styling instead of
   a label, which is what makes the card read as one quick flow rather
   than three or four separate stacked decisions. */
.ml-type-row { display: flex; gap: 6px; margin-bottom: 10px; }
.ml-type-row .al-chip { flex: 1; padding: 8px 2px; font-size: 9.5px; }
.ml-type-row .al-chip .em { font-size: 16px; }
.ml-quality-row { display: flex; gap: 6px; margin-bottom: 12px; }
.ml-quality-row .al-chip { flex: 1; flex-direction: row; justify-content: center; padding: 9px 4px; font-size: 10.5px; }
.ml-quality-row .al-chip .em { font-size: 14px; }

/* Library picks now live as a quiet pill row right where you're choosing
   what you ate, instead of their own labeled section above it. */
.ml-goto-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; }
.ml-goto-row::-webkit-scrollbar { display: none; }
.ml-goto { flex-shrink: 0; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.ml-goto.sel { background: #E4E9E0; border-color: var(--good); color: var(--good); font-weight: 600; }

.ml-note-input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 12.5px; font-family: inherit; background: var(--bg); margin-bottom: 12px; }

/* ---------- Workout Log ---------- */
.workout-week-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.workout-week-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.workout-week-pills button {
  padding: 7px 14px; border-radius: 100px; border: 1px solid var(--border); background: var(--surface);
  font-size: 13px; color: var(--text); cursor: pointer;
}
.workout-week-pills button.active { background: var(--text); color: var(--text-inverse); border-color: var(--text); }

.progression-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.progression-summary { font-size: 13px; line-height: 1.5; }
.progression-summary strong { color: var(--text); }
.progression-form { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.progression-form.open { display: block; }
.prog-field-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.prog-field-row label { font-size: 13px; flex: 1; min-width: 160px; }
.prog-field-row input, .prog-field-row select { width: 78px; box-sizing: border-box; text-align: center; }
.prog-field-row select.wide { width: auto; }
.toggle-switch {
  position: relative; width: 38px; height: 22px; border-radius: 100px; background: var(--border);
  flex-shrink: 0; cursor: pointer; transition: background 0.15s ease;
}
.toggle-switch.on { background: var(--accent); }
.toggle-switch.disabled { cursor: default; opacity: 0.5; }
.toggle-switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; transition: transform 0.15s ease;
}
.toggle-switch.on::after { transform: translateX(16px); }

.rep-range-row { display: flex; align-items: center; gap: 8px; }
.rep-range-row span { color: var(--muted); font-size: 13px; }

.workout-ex-item { border-bottom: 1px solid var(--border); }

}
.workout-set-prev { font-size: 12.5px; color: var(--muted); }

.workout-ex-notes-display { font-size: 12px; font-style: italic; color: var(--muted); padding: 4px 0; }
.workout-ex-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

.wset-remove { width: 22px; height: 22px; color: var(--muted); }

.photo-upload-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.photo-upload-preview {
  width: 44px; height: 44px; border-radius: 8px; background: var(--bg); border: 1px dashed var(--border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--muted); overflow: hidden;
}

.swatch-select-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.swatch-preview-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.14); }
.swatch-select { flex: 1; }
.checklist-item-text { flex: 1; }

/* ---------- Budget specific ---------- */
.view-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.view-toggle { display: flex; gap: 6px; margin-bottom: 0; }
.hidden-toggle-btn.active { background: var(--bg); border-color: var(--muted); }
.view-toggle button {
  background: var(--surface); border: 1px solid var(--border); border-radius: 100px;
  padding: 7px 14px; font-size: 12px; font-weight: 600; color: var(--muted);
}
.view-toggle button.active { background: var(--text); color: var(--text-inverse); border-color: var(--text); }

.budget-row-main { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }
.budget-fields { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.due-input { width: 56px; text-align: center; }
.split-chip {
  display: flex; align-items: center; gap: 5px;
  border: 1px solid var(--border); border-radius: 100px;
  padding: 4px 10px; font-size: 11px; font-weight: 600; color: var(--muted);
  cursor: pointer; background: var(--surface); white-space: nowrap;
}
.split-chip.on { background: #F1E7CF; border-color: #E0CD9D; color: #8A6A1F; }
.amount-input { width: 90px; text-align: right; }

.budget-row { border-top: 2px solid transparent; }
.budget-row:not(.editing) {
  display: grid;
  /* Category sizes to its own text (capped, so it can still wrap on
     narrow screens) instead of stretching to fill the row — otherwise on
     wide screens it soaks up all the space and shoves the amount up
     against the action icons. The empty "." track is the flexible one,
     so the amount always sits close to the category and only the
     actions get pushed to the true right edge. */
  grid-template-columns: auto minmax(0, max-content) auto 1fr auto;
  grid-template-areas: "handle category amount . actions";
  column-gap: 14px;
  align-items: center;
}
.budget-row:not(.editing) .budget-row-main { grid-area: category; min-width: 0; }
.budget-row:not(.editing) .budget-row-amount { grid-area: amount; }
.budget-row-actions { grid-area: actions; display: flex; align-items: center; gap: 8px; }
.budget-row-amount { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.budget-row.editing { flex-wrap: wrap; }
.budget-row.dragging { opacity: 0.4; }
.budget-row.drag-over-top { border-top: 2px solid var(--accent); }
.budget-row.drag-over-bottom { border-bottom: 2px solid var(--accent); }
.budget-drag-handle { grid-area: handle; color: var(--muted); cursor: grab; flex-shrink: 0; }
.budget-row.dragging .budget-drag-handle { cursor: grabbing; }
.budget-row-main .muted-sub { font-weight: 400; font-size: 11px; color: var(--muted); }
.budget-row.hidden-item .budget-row-main, .budget-row.hidden-item .budget-row-amount { opacity: 0.5; }

.paycheck-settings-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.paycheck-settings-form {
  border: 1px dashed var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; max-width: 320px;
}
.budget-flag { font-size: 12px; font-weight: 600; }
.budget-flag.over { color: #8C3F2B; }
.budget-flag.ok { color: var(--good); }
.unassigned-callout {
  font-size: 12px; font-weight: 600; color: var(--accent-dark);
  background: var(--bg); padding: 6px 10px; border-radius: 6px; margin-top: 4px;
}

.paycheck-card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.paycheck-card-head .amt { font-size: 20px; font-weight: 500; }

.goal-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.goal-row:last-child { border-bottom: none; }
.goal-label { flex: 1; font-size: 14px; }
.goal-label.done { text-decoration: line-through; color: var(--muted); }
.goal-label-input { flex: 1; min-width: 0; font-size: 14px; }
.goals-section { margin: 28px 0 14px; }
.goals-section-summary { display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; padding: 2px 0; }
.goals-section-summary::-webkit-details-marker { display: none; }
.goals-section .wardrobe-chevron { transition: transform 0.15s ease; }
.goals-section[open] .wardrobe-chevron { transform: rotate(180deg); }
.goals-section-body { margin-top: 12px; }
.goal-drag-handle { color: var(--muted); flex-shrink: 0; cursor: grab; }
.goal-row.dragging { opacity: 0.4; }
.goal-row.dragging .goal-drag-handle { cursor: grabbing; }
.goal-row.drag-over-top { border-top: 2px solid var(--accent); }
.goal-row.drag-over-bottom { border-bottom: 2px solid var(--accent); }

.wellness-select {
  width: 100%;
  font-weight: 600;
  border-width: 1.5px;
}
.wellness-select.good { background: #E4E9E0; border-color: #B9CBAE; color: var(--good); }
.wellness-select.bad { background: #F1DAD3; border-color: #E0B6A8; color: #8C3F2B; }
.wellness-select.mid { background: #F1E7CF; border-color: #E0CD9D; color: #8A6A1F; }

/* ---- Wellness's Today card — the journal, front and center ---- */
.wellness-journal-card { background: linear-gradient(180deg, #FFFDF9, var(--surface)); border: 1.5px solid #E7D9BE; }
.wellness-journal-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
.wellness-journal-title { font-size: 18px; }
.wellness-journal-date { font-size: 11.5px; }
.wellness-journal-sub { font-size: 12px; margin: 2px 0 14px; line-height: 1.5; }
.wellness-journal-pillars-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 8px; }

.journal-q { margin: 16px 0 0; }

.journal-q textarea {
  width: 100%; box-sizing: border-box; border: 1px dashed #D9C9A6; border-radius: 10px; background: #FFFEFB;
  font-family: inherit; font-size: 13.5px; padding: 10px 12px; resize: none; overflow: hidden; color: var(--text);
}

.wellness-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;

  border-radius: 100px;
  background: var(--bg);
  color: var(--muted);
  margin-left: 6px;
}
.wellness-badge.good { background: #E4E9E0; color: var(--good); }
.wellness-badge.bad { background: #F1DAD3; color: #8C3F2B; }

.wellness-history-note { font-size: 12px; color: var(--text); line-height: 1.45; margin-top: 3px; }
.wellness-history-note .muted { font-weight: 600; margin-right: 4px; }

/* Sleep — wind-down / morning log / trend report */
.sleep-card strong { display: block; font-size: 15px; }
.sleep-mood-row { display: flex; gap: 8px; margin: 10px 0 12px; }
.sleep-mood-choice { flex: 1; padding: 10px 4px; border-radius: 12px; text-align: center; border: 1.5px solid var(--border); background: var(--surface); font-family: inherit; cursor: pointer; }
.sleep-mood-choice .emoji { font-size: 19px; display: block; margin-bottom: 3px; }
.sleep-mood-choice .lbl { font-size: 10.5px; font-weight: 600; color: var(--muted); }
.sleep-mood-choice.sel { border-color: var(--accent-dark); background: rgba(169,128,79,0.1); }
.sleep-mood-choice.sel .lbl { color: var(--accent-dark); }
.sleep-note-input { width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; font-family: inherit; margin-bottom: 4px; background: var(--surface); color: var(--text); }
.sleep-habit-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; cursor: pointer; }
.sleep-habit-check { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--border); flex-shrink: 0; }
.sleep-habit-check.on { background: var(--good); border-color: var(--good); }
.sleep-save-btn { width: 100%; padding: 11px; border-radius: 10px; background: var(--accent-dark); color: #fff; text-align: center; font-weight: 700; font-size: 13.5px; border: none; font-family: inherit; cursor: pointer; margin-top: 12px; }
.sleep-saved-note { text-align: center; font-size: 11.5px; color: var(--good); font-weight: 600; margin-top: 8px; }
.sleep-hours-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 4px; }
.sleep-hours-big { font-family: "Source Serif 4", Georgia, serif; font-size: 21px; }
.sleep-stepper { display: flex; gap: 6px; }
.sleep-stepper button { width: 27px; height: 27px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text); font-family: inherit; }
.sleep-autodetect-chip { display: flex; align-items: center; gap: 8px; background: #E4E9E0; color: var(--good); border-radius: 10px; padding: 9px 12px; font-size: 12px; margin: 10px 0 4px; font-weight: 600; }
.sleep-chip-tick { width: 16px; height: 16px; border-radius: 50%; background: var(--good); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
.sleep-progress-card { background: rgba(201,162,74,0.12); border: 1.5px dashed #C9A24A; border-radius: 14px; padding: 13px; margin-bottom: 14px; }
.sleep-progress-label { font-size: 12.5px; font-weight: 700; color: var(--accent-dark); margin-bottom: 8px; }
.sleep-progress-dots { display: flex; gap: 5px; }
.sleep-progress-dots span { flex: 1; height: 8px; border-radius: 4px; background: var(--border); }
.sleep-progress-dots span.done { background: var(--accent-dark); }
.sleep-progress-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }
.sleep-report-hero { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); border-radius: 16px; padding: 16px; color: #fff; margin-bottom: 14px; }
.sleep-report-label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; font-weight: 700; }
.sleep-report-hero h3 { font-family: "Source Serif 4", Georgia, serif; font-size: 18px; margin: 4px 0 2px; }
.sleep-report-sub { font-size: 11.5px; opacity: .9; }
.sleep-insight-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px; margin-bottom: 10px; }
.sleep-insight-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sleep-insight-ic { width: 26px; height: 26px; border-radius: 8px; background: #F1DAD3; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.sleep-insight-ic.good { background: #E4E9E0; }
.sleep-insight-text { font-size: 12.5px; line-height: 1.4; color: var(--text); }
.sleep-insight-text b { color: var(--accent-dark); }
.sleep-bar-track { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: 2px; }
.sleep-bar-fill { height: 100%; border-radius: 3px; }
.sleep-bar-fill.good { background: var(--good); }
.sleep-bar-fill.bad { background: var(--danger); }
.sleep-dot-cal { display: flex; gap: 5px; flex-wrap: wrap; }
.sleep-dot-cal .sleep-dot { width: 16px; height: 16px; border-radius: 5px; background: var(--border); }
.sleep-dot-cal .sleep-dot.good { background: #E4E9E0; }
.sleep-dot-cal .sleep-dot.bad { background: #F1DAD3; }
.sleep-dot-cal .sleep-dot.mid { background: #F1E7CF; }
.sleep-target-row { display: flex; align-items: center; gap: 7px; margin: 4px 0 6px; }
.sleep-target-value { font-family: "Source Serif 4", Georgia, serif; font-size: 17px; color: var(--accent-dark); }
.sleep-target-row .sleep-stepper { margin-left: 4px; }
.sleep-target-warning { font-size: 11px; color: var(--danger); margin: 0 0 12px; line-height: 1.4; }
.sleep-target-feedback { font-size: 11.5px; font-weight: 600; margin: -2px 0 12px; padding: 7px 10px; border-radius: 8px; }
.sleep-target-feedback.good { background: #E4E9E0; color: var(--good); }
.sleep-target-feedback.bad { background: #F1DAD3; color: #8C3F2B; }
.sleep-collapsed-row { display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer; text-align: left; font-family: inherit; }
.sleep-collapsed-emoji { font-size: 22px; flex-shrink: 0; }
.sleep-collapsed-text { flex: 1; display: flex; flex-direction: column; }
.sleep-collapsed-title { font-size: 14px; font-weight: 700; color: var(--text); }
.sleep-collapsed-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.sleep-collapsed-chevron { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; transform: rotate(-90deg); }
.sleep-editor-box { max-height: 85vh; overflow-y: auto; }
.sleep-editor-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
.sleep-dot-cal .sleep-dot { border: none; padding: 0; cursor: pointer; font-family: inherit; }
.sleep-dot-cal .sleep-dot:focus-visible { outline: 2px solid var(--accent-dark); outline-offset: 2px; }

.setup-banner {
  background: #F1EBDD; color: var(--text); font-size: 13px; line-height: 1.5;
  padding: 12px 14px; border-radius: 8px; margin-bottom: 18px;
}

.prize-quote { border: 1px dashed var(--border); border-radius: 8px; padding: 14px 16px; }
.prize-quote textarea {
  width: 100%; border: none; background: transparent; resize: none; overflow: hidden;
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  font-size: 17px; font-style: italic; line-height: 1.55; color: var(--text); padding: 0;
  display: block;
}
.prize-quote textarea:focus { outline: none; }
.prize-divider { border-top: 1px solid var(--border); margin: 18px 0; }
.prize-cal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15px, 1fr)); gap: 4px; margin: 10px 0 2px 0; }
.prize-cal-cell { aspect-ratio: 1; border-radius: 3px; background: var(--border); }
.prize-cal-cell.good { background: var(--good); opacity: 0.78; }

/* ---------- Home tab: quiet summary cards, not editable here ---------- */
.home-greeting { font-size: 20px; font-family: "Source Serif 4", Georgia, "Times New Roman", serif; margin-bottom: 14px; color: var(--text); }
.home-card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.mini-link { font-size: 12px; color: var(--accent-dark); text-decoration: none; font-weight: 600; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
.home-quote-text { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: 17px; font-style: italic; line-height: 1.55; color: var(--text); }
.home-streak-row { display: flex; align-items: center; gap: 14px; }
.home-streak-ring { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.home-streak-ring-inner { width: 42px; height: 42px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text); }
.home-streak-caption { font-size: 13px; color: var(--muted); }
.home-streak-caption strong { color: var(--text); }
.tracking-grid-wrap { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.tracking-grid { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }

.tracking-grid-caption { font-size: 10.5px; color: var(--muted); margin-top: 6px; }
.home-bonus-teaser { display: flex; flex-direction: column; gap: 10px; }
.home-bonus-teaser img, .home-bonus-teaser .home-bonus-photo-placeholder {
  width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; flex-shrink: 0;
  background: var(--bg); border: 1px dashed var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); text-align: center;
}
.home-bonus-teaser-text { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.home-bonus-teaser-name { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: 17px; color: var(--text); }
.home-bonus-teaser-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* ---------- Home hero: wellness ring + reward + today's pillars ---------- */
.home-hero-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.home-hero-eyebrow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-dark); margin-bottom: 2px; }
.home-hero-prize-banner { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; margin-bottom: 16px; cursor: pointer; background: linear-gradient(135deg, #DCC9A6, #C7A876); border: 1px solid var(--border); }
.home-hero-prize-banner img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
.home-hero-prize-banner-noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(255,255,255,0.85); text-align: center; padding: 0 20px; }
.home-hero-prize-edit-btn {
  position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;

  backdrop-filter: blur(2px);
}

.home-hero-prize-name { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: 17px; color: #fff; }
.home-hero-prize-sub { font-size: 12px; color: #F3E8D4; margin-top: 1px; }
.home-hero-pillars-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
.home-hero-pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Streak */
.home-streak-flame { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.home-streak-flame-top { display: flex; align-items: center; gap: 8px; }
.home-streak-flame-icon { font-size: 22px; line-height: 1; display: inline-flex; }
.home-streak-flame-num { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: 26px; color: var(--accent-dark); }
.home-streak-flame-label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.home-streak-flame-longest { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* Deposits */
.home-deposit-track { margin-bottom: 14px; }
.home-deposit-track-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.home-deposit-track-label { font-size: 11.5px; font-weight: 700; color: var(--text); }
.home-deposit-track-count { font-size: 11.5px; font-weight: 700; color: var(--accent-dark); }
.home-deposit-track-bar { position: relative; height: 8px; border-radius: 5px; background: var(--border); }
.home-deposit-track-fill { height: 100%; border-radius: 5px; background: var(--accent-dark); }
.home-deposit-tick { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--accent); opacity: 0.55; }
.home-deposit-tick.passed { background: rgba(255, 255, 255, 0.65); opacity: 1; }

/* The slim Home reward pill — replaces the old always-on reward card.
   Nothing renders at all if no reward is set up; see renderHomeRewardPill. */
.reward-pill { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; margin-top: 14px; cursor: pointer; }
.reward-pill-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.reward-pill-icon svg { width: 23px; height: 23px; }
.reward-pill-body { flex: 1; min-width: 0; }
.reward-pill-name { font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reward-pill-bar { position: relative; height: 4px; border-radius: 3px; background: var(--border); margin-top: 5px; overflow: hidden; }
.reward-pill-fill { height: 100%; border-radius: 3px; background: var(--accent-dark); }
.reward-pill-figure { font-size: 11.5px; font-weight: 700; color: var(--accent-dark); white-space: nowrap; }
.reward-pill-chevron { color: var(--muted); flex-shrink: 0; }
.reward-pill.needs-link { border-style: dashed; }
.reward-pill.needs-link .reward-pill-name { color: var(--accent-dark); }
.home-reward-banner { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; margin-top: 14px; cursor: pointer; background: linear-gradient(135deg, #DCC9A6, #C7A876); border: 1px solid var(--border); }
.home-reward-banner.reached { border-color: var(--good); }
.home-reward-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
.home-reward-banner-empty { display: flex; align-items: center; justify-content: center; height: 100%; background: radial-gradient(circle at 35% 30%, #EFE0C4, #C7A876 60%, #8E6B3E 100%); }
.home-reward-banner-empty svg { width: 40px; height: 40px; }
.home-reward-scrim { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(30,20,10,.6) 100%); }
.home-reward-name { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: 17px; color: #fff; }
.home-reward-sub { font-size: 12px; color: #F3E8D4; margin-top: 1px; }
.home-reward-progress { margin-top: 10px; }
.home-reward-progress-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.home-reward-progress-label { font-size: 11.5px; font-weight: 700; }
.home-reward-progress-figure { font-size: 11.5px; font-weight: 700; color: var(--accent-dark); }
.home-reward-bar { position: relative; height: 8px; border-radius: 5px; background: var(--border); }
.home-reward-fill { height: 100%; border-radius: 5px; background: var(--accent-dark); }
.home-reward-fill.reached { background: var(--good); }
.home-link-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 9px 12px; border: 1.5px dashed var(--border); border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--accent-dark); cursor: pointer; background: transparent; }
.home-link-line-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; }
.home-link-line-icon svg { width: 100%; height: 100%; }
.sheet-overlay { position: fixed; inset: 0; background: rgba(34,30,26,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
.sheet-box { position: relative; width: 100%; max-width: 480px; background: var(--surface); border-radius: 20px 20px 0 0; padding: 28px 24px 30px; box-sizing: border-box; text-align: center; animation: sheet-rise 0.2s ease-out; }
@keyframes sheet-rise { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.sheet-close { position: absolute; top: 14px; right: 14px; }
.link-empty-icon { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, #EFE0C4, #C7A876 60%, #8E6B3E 100%); color: #fff; }
.link-empty-icon svg { width: 28px; height: 28px; }
.home-pillar { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px; border-radius: 12px; border: 1px solid transparent; background: #F1DAD3; cursor: pointer; font-family: inherit; }
.home-pillar.done { background: #E4E9E0; }
.home-pillar-icon { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.home-pillar-icon.on { background: var(--good); }
.home-pillar-icon.off { background: var(--danger); opacity: 0.5; }
.home-pillar.done .home-pillar-label { color: var(--good); }
.home-pillar:not(.done) .home-pillar-label { color: #8C3F2B; }
.home-pillar-label { font-size: 10.5px; font-weight: 600; text-align: center; line-height: 1.2; color: var(--text); }
.home-pillar-source { font-size: 8.5px; color: var(--muted); text-align: center; }
/* No practice connected yet — dimmed so it reads as "not loggable yet",
   distinct from both done and not-done-but-ready states. Still tappable:
   it opens Pillar Mapping instead of completing anything. */
.home-pillar.unlinked { background: var(--bg); border: 1px dashed var(--border); opacity: 0.72; }
.home-pillar.unlinked .home-pillar-icon.off { background: var(--border); opacity: 1; }
.home-pillar.unlinked .home-pillar-label { color: var(--muted); }
.home-pillar.unlinked .home-pillar-source { color: var(--accent-dark); font-weight: 600; }
/* Cycle lives on its own now, below the pillar grid — a state worth
   noting, not a habit with a pass/fail, so it never uses the pillar
   grid's red/green treatment: a neutral dashed row when unlogged, that
   phase's own warm color once it's logged. First of what should
   eventually be a small family of optional "extra" trackers. */
.cycle-tracker-wrap { margin-top: 14px; }
.cycle-tracker-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
.cycle-tracker-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1.5px dashed var(--border); cursor: pointer; font-family: inherit; text-align: left; }
.cycle-tracker-row.logged, .cycle-tracker-icon.cycle-on { background: #6E9B6A; }
.cycle-tracker-icon { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--surface); border: 1.5px solid var(--border); color: var(--muted); }
.cycle-tracker-text { flex: 1; min-width: 0; }
.cycle-tracker-title { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); }
.cycle-tracker-sub { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.cycle-tracker-value { font-size: 11.5px; font-weight: 600; color: var(--accent-dark); background: #EFE3D0; padding: 4px 9px; border-radius: 8px; flex-shrink: 0; white-space: nowrap; }
.cycle-tracker-value.muted { color: var(--muted); background: transparent; }
.home-hero-history-link { display: block; width: 100%; text-align: center; margin-top: 14px; font-size: 12px; color: var(--accent-dark); font-weight: 600; background: none; border: none; cursor: pointer; font-family: inherit; }

.home-shelf-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 2px 10px; display: flex; justify-content: space-between; align-items: baseline; }
.home-shelf-sub { font-size: 10.5px; font-weight: 600; color: var(--accent-dark); text-transform: none; letter-spacing: 0; }
.home-shelf-row { display: flex; gap: 9px; }
.home-shelf-tile { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 14px; border: 1.5px dashed var(--border); background: var(--surface); cursor: pointer; font-family: inherit; }
.home-shelf-tile-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--accent-dark); }
.home-shelf-tile-label { font-size: 10.5px; font-weight: 700; text-align: center; color: var(--text); }
.home-shelf-tile-cta { font-size: 9px; font-weight: 700; color: #fff; background: var(--accent-dark); border-radius: 999px; padding: 2px 9px; }
.home-shelf-tile-seeall { border-style: solid; justify-content: center; }
.home-shelf-tile-seeall .home-shelf-tile-label { color: var(--accent-dark); }

.home-yourspaces-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.home-yourspaces-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 4px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); position: relative; cursor: pointer; font-family: inherit; }
.home-yourspaces-tile-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--accent-dark); }
.home-yourspaces-tile-label { font-size: 10.5px; font-weight: 700; text-align: center; color: var(--text); }
.home-yourspaces-tile-pin { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.home-yourspaces-tile.manage { border-style: dashed; background: var(--bg); }
.home-yourspaces-tile.manage .home-yourspaces-tile-icon { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
.home-yourspaces-tile.manage .home-yourspaces-tile-label { color: var(--accent-dark); }

.home-yourspaces-head-static { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 12px; }
.home-yourspaces-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 12px; cursor: pointer; background: none; border: none; width: 100%; font-family: inherit; text-align: left; }
.home-yourspaces-head-left { display: flex; flex-direction: column; }
.home-yourspaces-title { font-size: 13px; font-weight: 700; color: var(--text); }
.home-yourspaces-count { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.home-yourspaces-chevron { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; transition: transform 0.15s ease; }
.home-yourspaces-chevron.open { transform: rotate(180deg); }
.home-yourspaces-preview-row { display: flex; align-items: center; gap: 6px; padding-bottom: 10px; }
.home-yourspaces-preview-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--accent-dark); cursor: pointer; flex-shrink: 0; }
.home-yourspaces-preview-dot svg { width: 15px; height: 15px; }
.home-yourspaces-preview-more { font-size: 10.5px; color: var(--muted); padding-left: 2px; }
.home-yourspaces-gallery-link { display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; padding: 10px 4px 2px; margin-top: 4px; border-top: 1px solid var(--border); background: none; border-left: none; border-right: none; border-bottom: none; font-size: 11.5px; font-weight: 700; color: var(--accent-dark); font-family: inherit; cursor: pointer; }
.home-yourspaces-gallery-link svg { width: 13px; height: 13px; }
.prize-photo-wrap { text-align: center; }
.prize-photo { width: 100%; max-width: 320px; aspect-ratio: 1; object-fit: cover; border-radius: 10px; cursor: pointer; }
.prize-photo-placeholder {
  width: 100%; max-width: 320px; aspect-ratio: 1; border: 1px dashed var(--border); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px;
  margin: 0 auto; cursor: pointer;
}
.prize-item-name {
  text-align: center; border: none; background: transparent; width: 100%; margin-top: 12px;
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: 17px; color: var(--text);
}
.prize-item-name:focus { outline: none; }

/* ---------- Boot loading ---------- */
.boot-loading {
  position: fixed; inset: 0; z-index: 999; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  transition: opacity 0.25s ease;
}
.boot-loading.hide { opacity: 0; pointer-events: none; }
.boot-loading-grid { width: 56px; height: 56px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; }
.boot-loading-grid div { border-radius: 10px; animation: bootTilePulse 1.2s ease-in-out infinite; }
.boot-loading-grid div:nth-child(1) { background: var(--border); animation-delay: 0s; }
.boot-loading-grid div:nth-child(2) { background: color-mix(in srgb, var(--accent) 50%, var(--border) 50%); animation-delay: 0.15s; }
.boot-loading-grid div:nth-child(3) { background: var(--accent); animation-delay: 0.3s; }
.boot-loading-grid div:nth-child(4) { background: var(--accent-dark); animation-delay: 0.45s; }
@keyframes bootTilePulse {
  0%, 100% { opacity: 0.35; transform: scale(0.88); }
  40% { opacity: 1; transform: scale(1); }
}
.boot-loading-text { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

  <div id="auth-gate" class="auth-gate" style="display:none;">
    <div class="auth-gate-card">
      <div class="brand-lockup" style="justify-content:center;margin-bottom:18px;">
        <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
        <div class="brand-wordmark">Addley</div>
      </div>
      <div class="auth-gate-tabs">
        <button type="button" class="auth-gate-tab active" data-mode="signin">Sign in</button>
        <button type="button" class="auth-gate-tab" data-mode="signup">Create account</button>
      </div>
      <form id="auth-gate-form">
        <label class="auth-gate-label">Email
          <input type="email" id="auth-gate-email" required autocomplete="email" />
        </label>
        <label class="auth-gate-label">Password
          <input type="password" id="auth-gate-password" required autocomplete="current-password" minlength="6" />
        </label>
        <button type="submit" class="btn-primary" id="auth-gate-submit" style="width:100%;margin-top:6px;">Sign in</button>
      </form>
      <div class="auth-gate-status" id="auth-gate-status"></div>
      <div class="auth-gate-divider"><span>or</span></div>
      <button type="button" class="btn-ghost" id="auth-gate-google" style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"></path><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3c-7.7 0-14.4 4.3-17.7 10.7z"></path><path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 36.2 26.8 37 24 37c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.5 40.6 16.2 45 24 45z"></path><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C40.9 36 44 30.5 44 24c0-1.4-.1-2.7-.4-3.5z"></path></svg>
        Continue with Google
      </button>
    </div>
  </div>

  <div id="boot-loading" class="boot-loading">
    <div class="boot-loading-grid"><div></div><div></div><div></div><div></div></div>
    <div class="boot-loading-text">Loading your practices&hellip;</div>
  </div>

  <div id="app-shell" class="app-shell">
    <header class="topbar">
      <button type="button" class="brand-lockup clickable" id="brand-home-btn" title="Go to Home">
        <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
        <div class="brand-wordmark">Addley</div>
      </button>
      <div class="topbar-right">
        <span id="save-indicator" class="save-indicator"></span>
        <button class="account-avatar-btn" id="account-avatar-btn" title="You"></button>
      </div>
    </header>

    <div class="shell-body">
      <div class="tabs-wrap" id="tabs-wrap">
        <button type="button" class="home-tab-row" id="home-tab-row" data-tab="home">
          <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path></svg>
          <span>Home</span>
        </button>

        <nav class="tabs" id="tabs-nav-left"></nav>

        <div class="home-tab-circle-wrap" id="home-tab-circle-wrap">
          <button type="button" class="home-tab-circle" id="home-tab-circle" data-tab="home" aria-label="Home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path></svg>
          </button>
          <div class="home-tab-mobile-label">HOME</div>
        </div>

        <nav class="tabs" id="tabs-nav-right"></nav>
      </div>

      <main class="content">
        <section id="panel-home" class="panel"></section>
        <section id="panel-todo" class="panel active"></section>
        <section id="panel-budget" class="panel"></section>
        <section id="panel-investments" class="panel"></section>
        <section id="panel-bible" class="panel"></section>
        <section id="panel-sleep" class="panel"></section>
        <section id="panel-appearance" class="panel"></section>
        <section id="panel-settings" class="panel"></section>
      </main>
    </div>
  </div>

  <script src="xlsx.mini.min.js"></script>
  <script src="supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
