<style>
:root {
  --bg: #F7F3EC;
  --surface: #FFFFFF;
  --border: #E4DCCB;
  --text: #221E1A;
  --muted: #8A7F70;
  --accent: #A9804F;
  --accent-dark: #7C5C36;
  --danger: #B3543E;
  --good: #55694A;
  --text-inverse: #FFFFFF;
}
/* Color themes — swap the root variables only. Type stays the same
   everywhere (Source Serif 4 / Work Sans) except Dark Mode, where body
   text picks up a touch more weight since thin strokes read too light
   against a dark background. */
html[data-app-theme="slate"] {
  --bg: #EDEFF2; --surface: #FFFFFF; --border: #D6DAE0; --text: #1E2328;
  --muted: #6B7580; --accent: #4A6178; --accent-dark: #33465A; --danger: #B3543E; --good: #4A7A6B;
}
html[data-app-theme="sage"] {
  --bg: #F1F4EE; --surface: #FFFFFF; --border: #DCE3D6; --text: #232A20;
  --muted: #7C8874; --accent: #7C9469; --accent-dark: #5B7048; --danger: #B3543E; --good: #556B45;
}
html[data-app-theme="rose"] {
  --bg: #FAF1EF; --surface: #FFFFFF; --border: #EBD9D4; --text: #2B2220;
  --muted: #9C8480; --accent: #C08887; --accent-dark: #9B6362; --danger: #B3543E; --good: #6B7A55;
}
html[data-app-theme="ocean"] {
  --bg: #EEF3F5; --surface: #FFFFFF; --border: #D3E0E5; --text: #182529;
  --muted: #5E7680; --accent: #2E6E7E; --accent-dark: #1F4E5A; --danger: #B3543E; --good: #3F7A5E;
}
html[data-app-theme="graphite"] {
  --bg: #EBEBEC; --surface: #FFFFFF; --border: #D4D4D7; --text: #1D1E20;
  --muted: #6C6D71; --accent: #4C545C; --accent-dark: #2E3338; --danger: #B3543E; --good: #4A7A6B;
}
html[data-app-theme="dark"] {
  --bg: #1B1B1D; --surface: #242426; --border: #38383B; --text: #EDEAE4;
  --muted: #9A968E; --accent: #C9A36A; --accent-dark: #E0B980; --danger: #E0897A; --good: #7FA06E;
  --text-inverse: #1B1B1D;
}
html[data-app-theme="dark"] body { font-weight: 500; }
* { box-sizing: border-box; }
/* Home is the shortest page — often barely taller than the viewport, or
   not even (nothing to scroll at all). On iOS Safari that's exactly the
   situation where a scroll/swipe gesture triggers the address bar's
   show/hide animation and the rubber-band bounce at the same time, and
   position:fixed elements are known to visibly lag or detach during that
   transition. Taller pages don't show it because the address bar has
   already settled by the time she's scrolled further down. This doesn't
   fix the animation itself, but removing the bounce (which Home hits
   immediately, having little/no real content to scroll past) removes
   one layer of it.
*/
html, body { overscroll-behavior-y: none; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Work Sans", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
}
.serif { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
.hidden { display: none !important; }
a { color: var(--accent-dark); }
button { font-family: inherit; cursor: pointer; }
input, select, textarea {
  font-family: inherit;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 9px;
  background: var(--surface);
  color: var(--text);
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- App shell ---------- */
.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
/* Fixed, not sticky — the actual scrolling here happens on the whole
   document (the inner .content overflow:auto never ends up clipping
   anything, since .app-shell only sets a min-height), and iOS Safari's
   position:sticky is unreliable on a flex child in that situation: it
   can go inert as soon as any tab switch changes the page's height, and
   it did — stayed stuck on Budget's height from her first sticky test
   and never re-anchored on other tabs. Fixed doesn't depend on where
   the scrolling is happening or the flex layout at all, and it's the
   same approach already used for the bottom nav. .shell-body gets a
   matching top margin (set from JS, see syncTopbarHeight) since a fixed
   element is out of normal flow and would otherwise sit under it.
*/
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 40;
}
.shell-body { margin-top: var(--topbar-h, 65px); }
.brand-lockup { display: flex; align-items: center; gap: 8px; }
.brand-lockup.clickable { cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
.brand-mark { width: 20px; height: 20px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; flex-shrink: 0; }
.brand-mark span { border-radius: 3px; }
.brand-mark span:nth-child(1) { background: var(--border); }
.brand-mark span:nth-child(2) { background: color-mix(in srgb, var(--accent) 50%, var(--border) 50%); }
.brand-mark span:nth-child(3) { background: var(--accent); }
.brand-mark span:nth-child(4) { background: var(--accent-dark); }
.brand-wordmark {
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
}
.topbar-right { display: flex; align-items: center; gap: 14px; }
.save-indicator { font-size: 12px; color: var(--muted); min-width: 90px; text-align: right; transition: opacity .3s; }
.save-indicator.err { color: var(--danger); }

.menu-btn-wrap { position: relative; }
.menu-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); flex-shrink: 0;
}
.menu-btn:hover { background: var(--bg); color: var(--text); }
.menu-btn.active { color: var(--accent); border-color: var(--accent); }
.menu-dropdown {
  position: absolute; top: 42px; right: 0; width: 220px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.14); padding: 8px; z-index: 20;
  display: none;
}
.menu-dropdown.open { display: block; }

.account-avatar-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none; flex-shrink: 0;
  background: var(--accent); color: var(--text-inverse); font-family: "Source Serif 4", Georgia, serif;
  font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  position: relative; cursor: pointer;
}
.account-avatar-btn:hover { background: var(--accent-dark); }
.account-modal-box { width: 340px; max-width: 92vw; }
.account-modal-header-row { display: flex; align-items: center; gap: 14px; padding: 4px 0 18px; }
.account-avatar-lg {
  width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--text-inverse);
  font-family: "Source Serif 4", Georgia, serif; font-size: 20px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.account-email { font-weight: 600; font-size: 14.5px; word-break: break-all; }
.account-plan-badge {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; padding: 3px 9px;
  border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--bg); color: var(--accent-dark);
}
.account-plan-badge.founder { background: var(--accent-dark); color: var(--text-inverse); }
.account-section { border-top: 1px solid var(--border); padding: 14px 0; }
.account-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
.account-note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.unlink-btn { display: block; width: 100%; text-align: center; background: none; border: 1.5px solid var(--border); border-radius: 9px; padding: 10px; font-size: 12.5px; font-weight: 700; color: var(--danger); cursor: pointer; font-family: inherit; margin-top: 14px; }
.account-btn {
  width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 13px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
}
.account-btn:hover { background: var(--bg); }
.account-btn[disabled] { opacity: 0.5; cursor: default; }
.account-btn[disabled]:hover { background: var(--surface); }
.account-btn.danger { color: #8C3F2B; }
.account-btn.danger:hover { background: #F1DAD3; border-color: #E0B6A8; }

.grace-token-icon-badge {
  width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  background: linear-gradient(145deg, #DCC9A6, #B98F58); box-shadow: 0 2px 6px rgba(124,92,54,.3); color: #fff;
}
.grace-token-icon-badge svg { width: 16px; height: 16px; }
.grace-token-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.grace-token { flex: 1 1 34px; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
.grace-token.filled {
  background: linear-gradient(145deg, #DCC9A6, #B98F58);
  box-shadow: 0 3px 7px rgba(124,92,54,.4), inset 0 0 0 2px rgba(255,255,255,.3), inset 0 0 0 3px rgba(122,74,0,.22), inset 0 1px 2px rgba(255,255,255,.55), inset 0 -2px 3px rgba(122,74,0,.3);
}
.grace-token.filled svg { width: 18px; height: 18px; }
.grace-token.empty { background: var(--bg); border: 1.5px dashed var(--border); }
.grace-token-caption { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 4px; }
.grace-earn-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 9px 0; border-top: 1px solid var(--border); }
.grace-earn-row:first-child { border-top: none; }
.grace-earn-row b { color: var(--text); }
.account-btn-sub { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* "You" page — flat list, no cards, per the Etsy/Slack-style reference. */
.you-status-pill { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 12px; color: var(--muted); margin: 2px 0 14px; }
.you-identity-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
.you-list-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 2px; font-size: 14px; font-weight: 600; color: var(--text); background: none; border: none; text-align: left; cursor: pointer; font-family: inherit; }
.you-list-row:hover { color: var(--accent-dark); }
.you-list-row svg { width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.you-list-row.danger { color: #8C3F2B; }
.you-list-row.danger svg { stroke: #8C3F2B; }
.you-list-divider { height: 1px; background: var(--border); margin: 6px 0; }
.account-modal-box input[type="password"] { width: 100%; box-sizing: border-box; }
.menu-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
  font-size: 14px; color: var(--text); cursor: pointer; background: none; border: none;
  width: 100%; text-align: left; font-family: inherit;
}
.menu-item:hover { background: var(--bg); }
.menu-item.active { color: var(--accent); }
.menu-item svg { flex-shrink: 0; color: var(--muted); }
.menu-item.active svg { color: var(--accent); }
.menu-item .menu-item-sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }

/* Sheets that don't fit in the bottom bar on mobile — same look as
   Settings/Appearance, listed above them with a small divider. Hidden
   on desktop, where the sidebar already lists every sheet. */
.menu-sheets-section { display: none; }
.menu-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 6px 12px 4px; }
.menu-divider { height: 1px; background: var(--border); margin: 6px 4px; }
@media (max-width: 720px) {
  .menu-sheets-section.has-items { display: block; }
}

.btn-ghost {
  background: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.btn-ghost:hover { background: var(--bg); }
.btn-ghost.small { padding: 5px 10px; font-size: 12px; }

.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 600;
}
.btn-primary:hover { background: var(--accent-dark); }
.btn-primary:disabled { opacity: 0.6; cursor: default; }

.auth-gate {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg, #F7F3EC);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.auth-gate-card {
  width: 100%; max-width: 340px;
  background: #FFFFFF;
  border: 1px solid var(--border, #E4DCCB);
  border-radius: 14px;
  padding: 28px 24px;
  box-shadow: 0 4px 20px rgba(34,30,26,0.06);
}
.auth-gate-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
.auth-gate-tab {
  flex: 1; padding: 8px 10px; border-radius: 100px; border: 1px solid var(--border, #E4DCCB);
  background: none; font-size: 13px; font-weight: 500; color: var(--muted, #8A7F70); cursor: pointer;
}
.auth-gate-tab.active { background: var(--accent, #A9804F); border-color: var(--accent, #A9804F); color: #fff; }
.auth-gate-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 12px; }
.auth-gate-label input {
  display: block; width: 100%; box-sizing: border-box; margin-top: 5px;
  padding: 9px 11px; border: 1px solid var(--border, #E4DCCB); border-radius: 7px; font-size: 14px;
}
.auth-gate-status { margin-top: 12px; font-size: 12.5px; color: var(--muted, #8A7F70); min-height: 16px; }
.auth-gate-status.err { color: #B3392B; }
.auth-gate-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; font-size: 12px; color: var(--muted, #8A7F70); }
.auth-gate-divider::before, .auth-gate-divider::after { content: ""; flex: 1; height: 1px; background: var(--border, #E4DCCB); }

.tab-icon { flex-shrink: 0; }
.shell-body { flex: 1; display: flex; min-height: 0; }
.content {
  flex: 1;
  padding: 28px 24px 60px 24px;
  max-width: 880px;
  width: 100%;
  margin: 0 auto;
  overflow-y: auto;
}

/* ----- Desktop / laptop (default): left sidebar nav ----- */
.tabs-wrap {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 220px;
  flex-shrink: 0;
  padding: 20px 12px;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
/* Home lives first in the DOM (so it can sit fixed at the leading edge
   on mobile) and always renders first in the sidebar too. */
.home-tab-row { order: -1; }
.tabs { display: contents; }
.tab-btn, .home-tab-row {
  display: flex;
  align-items: center;
  gap: 11px;
  background: none;
  border: none;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  text-align: left;
  font-family: inherit;
  cursor: pointer;
}
.tab-btn:hover, .home-tab-row:hover { background: var(--bg); }
.tab-btn.active, .home-tab-row.active { color: var(--text); background: var(--bg); font-weight: 600; }
.tab-btn.active .tab-icon, .home-tab-row.active .tab-icon { color: var(--accent); }
.home-tab-circle-wrap { display: none; }

/* ----- Mobile / narrow viewport: bottom tab bar, Home fixed in the middle ----- */
@media (max-width: 720px) {
  .shell-body { flex-direction: column; padding-bottom: 78px; }
  .tabs-wrap {
    display: flex;
    flex-direction: row;
    align-items: center;
    width: auto;
    gap: 0;
    padding: 0 2px;
    border-right: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 76px;
    z-index: 10;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  /* The desktop-style row is swapped out for a raised circle button that
     never scrolls away, whatever else gets added on either side of it. */
  .home-tab-row { display: none; }
  .home-tab-circle-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    width: 60px;
    margin-top: -26px;
  }
  .home-tab-circle {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
    border: 3px solid var(--surface);
    box-shadow: 0 6px 14px rgba(0,0,0,0.22);
  }
  .home-tab-circle.active { background: var(--accent-dark); }
  .home-tab-mobile-label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.03em;
    color: var(--accent-dark); margin-top: 2px; text-align: center;
  }
  .tabs {
    display: flex;
    flex: 1 1 0;
    min-width: 0;
    justify-content: space-around;
  }
  /* Sheets past the pinned count don't render into the bottom bar at
     all on mobile — they show up in the top menu instead (see
     .menu-sheets-section). No scrolling, nothing to swipe past. */
  .tab-btn.tab-btn-overflow { display: none; }
  .tab-btn {
    flex-direction: column; gap: 4px; padding: 6px 4px; font-size: 10px; font-weight: 600; border-radius: 10px;
    flex: 1 1 0;
    min-width: 0;
  }
  .tab-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tab-btn.active { background: none; }
  .content { padding: 20px 16px 40px 16px; }
  .topbar { padding: 14px 16px; }
  .save-indicator { min-width: 0; }
}

.panel { display: none; }
.panel.active { display: block; }

.section-title { font-size: 22px; font-weight: 500; margin: 0 0 18px 0; }
.subsection-title { font-size: 15px; font-weight: 600; margin: 28px 0 12px 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }

.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.row:last-child { border-bottom: none; }

.checkbox {
  width: 20px; height: 20px; border-radius: 5px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer;
}
.checkbox.checked { background: var(--accent); border-color: var(--accent); }
.checkbox svg { display: none; }
.checkbox.checked svg { display: block; }

.badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 100px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.badge.high { background: #F1DAD3; color: #8C3F2B; }
.badge.medium { background: #F1E7CF; color: #8A6A1F; }
.badge.low { background: #E3E7DC; color: #55694A; }
.badge.p1 { background: #E4E9E0; color: var(--good); }
.badge.p2 { background: #EAE2F0; color: #6B4E82; }
.badge.unassigned { background: var(--bg); color: var(--muted); }

/* To-Do rows: CSS grid so priority/actions always land in a predictable
   spot instead of relying on flex-wrap (which folded mid-line on narrow
   screens). Priority is a small color-coded dot, not a column-hogging
   dropdown — set once when the task is added, changeable with a tap. */
.todo-row {
  display: grid;
  grid-template-columns: auto auto 1fr auto auto;
  grid-template-areas: "handle check task priority actions";
  align-items: center;
  column-gap: 12px;
  row-gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  border-top: 2px solid transparent;
}
.todo-row:last-child { border-bottom: none; }
.todo-drag-handle { grid-area: handle; color: var(--muted); cursor: grab; flex-shrink: 0; }
.todo-row.dragging { opacity: 0.4; }
.todo-row.dragging .todo-drag-handle { cursor: grabbing; }
.todo-row.drag-over-top { border-top: 2px solid var(--accent); }
.todo-row.drag-over-bottom { border-bottom: 2px solid var(--accent); }
.todo-header-row .todo-drag-handle { visibility: hidden; }
.todo-col-check { grid-area: check; }
.todo-task-label, .todo-edit-task { grid-area: task; min-width: 0; }
.todo-priority-dot { grid-area: priority; width: 14px; height: 14px; border-radius: 50%; border: none; padding: 0; cursor: pointer; flex-shrink: 0; }
.todo-priority-dot.priority-high { background: #8C3F2B; }
.todo-priority-dot.priority-medium { background: #C9A24A; }
.todo-priority-dot.priority-low { background: #55694A; }
.todo-col-priority { grid-area: priority; font-size: 12px; font-weight: 500; padding: 5px 6px; width: 100%; }
.todo-col-actions { grid-area: actions; }
.todo-header-row { padding-bottom: 8px; margin-bottom: 4px; }
.todo-header-row .todo-col-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.todo-header-row select { font-size: 12px; font-weight: 500; padding: 5px 6px; }
.todo-add-btn { margin-top: 14px; width: 100%; }

/* ---------- Lists overview + detail ---------- */
.list-card { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 9px; cursor: pointer; text-align: left; font-family: inherit; }
.list-card-icon { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
.list-card-icon svg { width: 19px; height: 19px; }
.list-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.list-card-name { font-size: 14px; font-weight: 700; color: var(--text); }
.list-card-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.list-card-chevron { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
.new-list-tile { display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 14px; border: 1.5px dashed var(--border); background: none; width: 100%; cursor: pointer; margin-top: 4px; font-family: inherit; }
.new-list-tile-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--accent-dark); flex-shrink: 0; }
.new-list-tile-label { font-size: 13px; font-weight: 700; color: var(--accent-dark); }

.list-detail-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.list-back-btn, .list-delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px; flex-shrink: 0; }
.list-detail-title { flex: 1; cursor: pointer; }

.field-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
.field-label:first-of-type { margin-top: 4px; }
.icon-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-choice { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--border); background: var(--bg); color: var(--accent-dark); cursor: pointer; }
.icon-choice svg { width: 18px; height: 18px; }
.icon-choice.selected { border-color: var(--accent-dark); background: var(--accent-dark); color: #fff; }
.color-grid { display: flex; gap: 8px; }
.color-choice { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.color-choice.selected { border-color: var(--text); }
.style-toggle { display: flex; gap: 8px; margin-top: 2px; }
.style-choice { flex: 1; padding: 9px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg); font-size: 12px; font-weight: 700; text-align: center; cursor: pointer; color: var(--text); font-family: inherit; }
.style-choice.selected { border-color: var(--accent-dark); background: var(--accent-dark); color: #fff; }

/* Inline "add item" composer — expands in place instead of a popup */
.inline-composer { border: 1.5px solid var(--accent-dark); border-radius: 12px; padding: 10px; margin-top: 14px; }
.inline-composer-input { width: 100%; box-sizing: border-box; border: none; outline: none; font-family: inherit; font-size: 13.5px; background: none; margin-bottom: 8px; color: var(--text); }
.inline-composer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.inline-pri-picks { display: flex; gap: 6px; }
.inline-pri-dot { width: 18px; height: 18px; border-radius: 50%; border: none; padding: 0; cursor: pointer; opacity: 0.5; }
.inline-pri-dot.sel { opacity: 1; border: 2px solid var(--text); }
.inline-pri-dot.priority-high { background: #8C3F2B; }
.inline-pri-dot.priority-medium { background: #C9A24A; }
.inline-pri-dot.priority-low { background: #55694A; }
.inline-composer-actions { display: flex; gap: 6px; }
.inline-btn { font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-family: inherit; color: var(--text); }
.inline-btn.save { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }

.muted { color: var(--muted); font-size: 13px; }
.strike { text-decoration: line-through; color: var(--muted); }

.add-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
.add-form input, .add-form select { flex: 1; min-width: 110px; }

table { width: 100%; border-collapse: collapse; }
.table-scroll { overflow-x: auto; margin: 0 -2px; padding: 0 2px; }
.table-scroll table { min-width: 480px; }
.table-scroll td, .table-scroll th { white-space: nowrap; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
td input { width: 100%; border: 1px solid transparent; background: none; padding: 4px 6px; }
td input:hover { border-color: var(--border); }

.progress-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; }

.quran-list { margin-top: 4px; }
.quran-row { display: flex; align-items: flex-start; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.quran-row:last-child { border-bottom: none; }
.quran-text { font-size: 13px; color: var(--text); line-height: 1.35; flex: 1; padding-top: 1px; }
.quran-text.done { text-decoration: line-through; color: var(--muted); }

.book-group { border-bottom: 1px solid var(--border); padding: 10px 0; }
.book-summary { display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; padding: 4px 0; }
.book-summary::-webkit-details-marker { display: none; }
.home-section-title-group { display: flex; align-items: center; gap: 7px; }
.home-section-icon { font-size: 16px; line-height: 1; }
.book-title { font-weight: 600; font-size: 14px; }
.chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 6px; margin-top: 12px; }
.chapter-chip {
  width: 30px; height: 30px; border-radius: 6px;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; cursor: pointer; color: var(--muted);
}
.chapter-chip.done { background: var(--accent); border-color: var(--accent); color: #fff; }

.remove-btn { background: none; border: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 4px; }
.remove-btn:hover { color: var(--danger); }

.wellness-history-row { font-size: 13px; }

.top-summary { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
.top-summary .value { font-size: 30px; font-weight: 500; }

/* ---------- Bible reading pace ---------- */
.bible-jump-btn { flex-shrink: 0; }
.bible-pace-stats { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 20px; }
.bible-pace-stat label { display: block; font-size: 11px; margin-bottom: 5px; }
.bible-pace-stat-value {
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  font-size: 17px;
  color: var(--text);
}
.bible-pace-stat .bible-start-date { font-size: 14px; padding: 5px 8px; }
.bible-pace-track { position: relative; height: 8px; background: var(--border); border-radius: 4px; margin-bottom: 6px; }
.bible-pace-track-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 4px; opacity: 0.55; }
.bible-pace-tick { position: absolute; top: -5px; width: 2px; height: 18px; background: var(--muted); border-radius: 1px; margin-left: -1px; }
.bible-pace-tick.plan { opacity: 0.7; }
.bible-pace-tick.projected {
  width: 11px; height: 11px; border-radius: 50%; top: -2.5px; margin-left: -5px;
  border: 2px solid var(--surface); background: var(--accent);
}
.bible-pace-tick.projected.ahead, .bible-pace-tick.projected.done { background: var(--good); }
.bible-pace-tick.projected.behind { background: #8C3F2B; }
.bible-pace-tick.projected.onpace { background: var(--accent); }
.bible-pace-track-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 16px; }
.bible-pace-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
.bible-pace-badge.ahead, .bible-pace-badge.done { background: #E4E9E0; color: var(--good); }
.bible-pace-badge.behind { background: #F1DAD3; color: #8C3F2B; }
.bible-pace-badge.onpace { background: #F1E7CF; color: #8A6A1F; }
.bible-pace-badge.pending { background: var(--border); color: var(--muted); }

.bible-ring-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.bible-ring { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.bible-ring-inner { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; }
.bible-ring-pct { font-size: 14px; font-weight: 700; color: var(--text); }
.bible-ring-caption { font-size: 13px; color: var(--muted); line-height: 1.5; }
.bible-ring-caption strong { color: var(--text); }
.bible-pace-mini-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.bible-pace-mini-row label { font-size: 11px; }
.bible-pace-mini-row .bible-start-date, .bible-pace-mini-row .quran-start-date { font-size: 13px; padding: 4px 7px; }
.bible-pace-mini-row .filler-btn { margin-left: auto; }
.filler-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  font-family: inherit;
  cursor: pointer;
}
.filler-btn:hover { background: var(--bg); color: var(--text); }

/* ---------- Settings ---------- */
.settings-sub { font-size: 13px; color: var(--muted); margin: 0 0 22px 0; }
.settings-group-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 22px 0 4px 0; }
.settings-group-title:first-of-type { margin-top: 6px; }
.settings-group-desc { font-size: 13px; color: var(--muted); margin: 0 0 14px 0; }
.settings-segment { display: flex; gap: 6px; margin: 6px 0 4px; }
.settings-segment button {
  flex: 1; padding: 9px 14px; border-radius: 100px; border: 1px solid var(--border);
  background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--muted);
  cursor: pointer; font-family: inherit;
}
.settings-segment button.active { background: var(--text); color: var(--text-inverse); border-color: var(--text); }

.sheet-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); border-top: 2px solid transparent; }
.sheet-row:last-child { border-bottom: none; }
.sheet-row.dragging { opacity: 0.4; }
.sheet-row.drag-over-top { border-top: 2px solid var(--accent); }
.sheet-row.drag-over-bottom { border-bottom: 2px solid var(--accent); }
.sheet-drag-handle { color: var(--muted); flex-shrink: 0; cursor: grab; }
.sheet-row.dragging .sheet-drag-handle { cursor: grabbing; }
.sheet-row-icon {
  width: 34px; height: 34px; border-radius: 8px; background: var(--bg);
  display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;
}
.sheet-row-name { font-weight: 600; flex: 1; }
.sheet-row-name .muted-sub { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 1px; }
.sheet-row-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0;
}
.icon-btn:hover { background: var(--bg); color: var(--text); }
.icon-btn.danger:hover { background: #F1DAD3; color: #8C3F2B; border-color: #E0B6A8; }
.icon-btn.active-toggle { color: var(--accent); border-color: var(--accent); }
.icon-btn[disabled] { opacity: 0.35; cursor: default; }
.icon-btn[disabled]:hover { background: var(--surface); color: var(--muted); }

.practice-zone-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 8px; }
.practice-zone-label:first-of-type { margin-top: 4px; }
.practice-tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.practice-tile {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 6px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; user-select: none;
}
.practice-tile.dragging { opacity: 0.4; }
.practice-tile.drag-over-before { box-shadow: inset 2px 0 0 var(--accent); }
.practice-tile.drag-over-after { box-shadow: inset -2px 0 0 var(--accent); }
.practice-tile-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.practice-tile-label { font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.25; }
.practice-tile-menu-btn {
  position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: none;
  background: transparent; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; font-family: inherit;
}
.practice-tile-menu-btn:hover { background: var(--bg); color: var(--text); }
.practice-tile-menu {
  position: absolute; top: 24px; right: 3px; z-index: 5; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.12); display: flex; flex-direction: column; min-width: 90px; overflow: hidden;
}
.practice-tile-menu button {
  border: none; background: none; text-align: left; padding: 8px 12px; font-size: 12px; font-weight: 600;
  color: var(--text); cursor: pointer; font-family: inherit;
}
.practice-tile-menu button:hover { background: var(--bg); }
.practice-tile-menu button.danger { color: #B3543E; }
.practice-tile-empty { grid-column: 1 / -1; border: 1.5px dashed var(--border); border-radius: 12px; padding: 16px 8px; text-align: center; font-size: 12px; color: var(--muted); }

.pillar-map-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface); }
.pillar-map-head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.pillar-map-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
.pillar-map-icon svg { width: 15px; height: 15px; }
.pillar-map-name { font-size: 13.5px; font-weight: 700; flex: 1; }
.pillar-map-auto-tag { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.pillar-map-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-left: 38px; }
.pillar-map-chip { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; }
.pillar-map-chip.on { background: var(--accent-dark); color: var(--text-inverse); border-color: var(--accent-dark); }
.pillar-map-chip.auto { background: var(--bg); color: var(--muted); border-color: transparent; cursor: default; }
.pillar-map-chip .x { margin-left: 3px; }
.pillar-map-note { margin-left: 38px; font-size: 11px; color: var(--muted); margin-top: 6px; }

.onboarding-overlay {
  position: fixed; inset: 0; background: rgba(34,30,26,0.55); z-index: 500;
  display: flex; align-items: center; justify-content: center; padding: 18px;
}
.onboarding-box {
  width: 100%; max-width: 400px; max-height: 88vh; overflow-y: auto; background: var(--bg);
  border-radius: 20px; padding: 26px 22px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
.onboarding-dots { display: flex; gap: 5px; justify-content: center; margin-bottom: 18px; }
.onboarding-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.onboarding-dot.active { background: var(--accent-dark); width: 16px; border-radius: 3px; }
.onboarding-eyebrow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; margin-bottom: 4px; }
.onboarding-headline { font-family: "Source Serif 4", Georgia, serif; font-size: 22px; font-weight: 600; text-align: center; margin: 0 0 8px; line-height: 1.25; }
.onboarding-subline { font-size: 12.5px; color: var(--muted); text-align: center; margin-bottom: 20px; line-height: 1.5; }
.onboarding-pillar-list { display: flex; flex-direction: column; gap: 8px; }
.onboarding-pillar-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.onboarding-pillar-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
.onboarding-pillar-icon svg { width: 18px; height: 18px; }
.onboarding-pillar-name { font-size: 13.5px; font-weight: 700; }
.onboarding-headline-icon { display: inline-flex; vertical-align: -5px; color: var(--accent); }
.onboarding-headline-icon svg { width: 22px; height: 22px; }
.onboarding-choice-row { display: flex; flex-direction: column; gap: 8px; }
.onboarding-choice-opt { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 13px; font-weight: 600; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.onboarding-choice-opt.sel, .onboarding-choice-opt:hover { border-color: var(--accent-dark); background: var(--bg); }
.onboarding-choice-opt .opt-sub { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.onboarding-extra-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
.onboarding-toolbar-target { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; background: var(--surface); border: 1.5px dashed var(--border); border-radius: 14px; padding: 12px; }
.onboarding-toolbar-slot { aspect-ratio: 1; border-radius: 10px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 9.5px; font-weight: 700; text-align: center; padding: 4px; cursor: grab; }
.onboarding-toolbar-slot .ic, .onboarding-extra-slot .ic { color: var(--accent); display: inline-flex; }
.onboarding-toolbar-slot .ic svg, .onboarding-extra-slot .ic svg { width: 17px; height: 17px; }
.onboarding-toolbar-slot.dragging { opacity: .35; }
.onboarding-extra-row { display: flex; gap: 8px; }
.onboarding-extra-slot { flex: 1; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 10px 4px; font-size: 9.5px; font-weight: 700; text-align: center; cursor: grab; transition: opacity .15s, border-color .15s; }
.onboarding-extra-slot.dragging { opacity: .35; }
.onboarding-extra-slot.drag-over { border-color: var(--accent-dark); }
.onboarding-review-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.onboarding-review-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; display: flex; align-items: baseline; justify-content: space-between; }
.onboarding-review-card .ic { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(145deg, #F3E7D2, #E3D1AC); box-shadow: inset 0 1px 1px rgba(255,255,255,.5), 0 1px 3px rgba(124,92,54,.18); }
.onboarding-review-card .ic svg { width: 15px; height: 15px; }
.drag-hint { font-size: 9.5px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); opacity: .75; }
.completion-badge {
  width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, #DCC9A6, #B98F58);
  box-shadow: 0 6px 16px rgba(124,92,54,.4), inset 0 1px 1px rgba(255,255,255,.4);
  opacity: 0; transform: scale(.6); animation: badgePop .55s cubic-bezier(.34,1.56,.64,1) .05s forwards;
}
.completion-badge svg { width: 28px; height: 28px; }
@keyframes badgePop { to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .completion-badge { animation: none; opacity: 1; transform: none; } }
.closing-beat { text-align: center; font-family: "Source Serif 4", Georgia, serif; font-size: 14.5px; line-height: 1.55; color: var(--text); padding: 14px 6px 4px; }
.closing-beat b { color: var(--accent-dark); }
.onboarding-lock-note { display: flex; gap: 8px; align-items: flex-start; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 11.5px; color: var(--text); line-height: 1.5; margin-bottom: 4px; }
.onboarding-primary-btn { display: block; width: 100%; margin-top: 18px; background: var(--accent-dark); color: var(--text-inverse); text-align: center; font-weight: 700; font-size: 14px; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-family: inherit; }
.onboarding-text-input { width: 100%; box-sizing: border-box; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: inherit; background: var(--surface); margin-bottom: 12px; color: var(--text); }
.onboarding-field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; display: block; }
.onboarding-skip-link { display: block; width: 100%; text-align: center; margin-top: 12px; font-size: 12px; color: var(--muted); text-decoration: underline; background: none; border: none; cursor: pointer; font-family: inherit; }
.goal-dollar-row { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 12px; overflow: hidden; }
.goal-dollar-sign { padding: 12px 0 12px 14px; font-size: 14px; color: var(--muted); font-weight: 700; }
.goal-dollar-row input { border: none; padding: 12px 14px 12px 4px; font-size: 14px; font-family: inherit; flex: 1; min-width: 0; background: transparent; color: var(--text); }
.goal-dollar-row input:focus { outline: none; }
.photo-upload-zone { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 14px; border: 1.5px dashed var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; cursor: pointer; overflow: hidden; }
.photo-upload-zone-inner { text-align: center; color: var(--muted); }
.photo-upload-zone-inner .plus-badge { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #EFE0C4, #C7A876 60%, #8E6B3E 100%); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
.photo-upload-zone-inner .plus-badge svg { width: 18px; height: 18px; }
.photo-upload-zone-inner .label { font-size: 12.5px; font-weight: 700; color: var(--text); }
.photo-upload-zone-inner .sub { font-size: 11px; margin-top: 2px; }

.space-usage-row { margin-bottom: 18px; max-width: 420px; }
.space-usage-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.space-usage-label { font-size: 12px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .03em; }
.space-usage-count { font-size: 12px; font-weight: 700; color: var(--accent-dark); }
.space-usage-bar { height: 7px; border-radius: 5px; background: var(--border); overflow: hidden; }
.space-usage-fill { height: 100%; background: var(--good); border-radius: 5px; }
.space-usage-fill.full { background: var(--accent-dark); }

.sheet-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.sheet-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.sheet-card-icon { width: 34px; height: 34px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.sheet-card-name { font-weight: 600; }
.sheet-card-desc { font-size: 13px; color: var(--muted); flex: 1; }
.sheet-card-added {
  display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
  padding: 7px 14px; border-radius: 7px; background: var(--text); color: var(--text-inverse);
  font-size: 13px; font-weight: 600;
}
.sheet-card-added svg { flex-shrink: 0; }

.theme-swatch-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (max-width: 480px) { .theme-swatch-grid { grid-template-columns: 1fr; } }
.theme-swatch-card {
  border: 2px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer;
  background: var(--surface); text-align: left; padding: 0; font-family: inherit;
}
.theme-swatch-card.selected { border-color: var(--accent); }
.theme-swatch-preview { display: flex; height: 56px; }
.theme-swatch-preview span { flex: 1; }
.theme-swatch-card-body { padding: 10px 12px 12px; display: flex; align-items: center; justify-content: space-between; }
.theme-swatch-name { font-weight: 600; font-size: 13.5px; color: var(--text); }
.theme-swatch-current-tag { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.theme-swatch-check {
  width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; font-size: 12px;
}
.theme-swatch-card.selected .theme-swatch-check { background: var(--accent); border-color: var(--accent); }

.modal-overlay { position: fixed; inset: 0; background: rgba(34, 30, 26, 0.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal-box { background: var(--surface); border-radius: 12px; padding: 24px; width: 340px; max-width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.18); max-height: 85vh; overflow-y: auto; }
.modal-box h3 { margin: 0 0 10px 0; font-size: 17px; }
.modal-box p { margin: 0 0 20px 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* Pillar quick-log — a bottom sheet rather than a centered modal, so it
   reads as fast and disposable, not a form to fill out. */
.modal-overlay.sheet { align-items: flex-end; padding: 0; }
.pillarql-box { width: 100%; max-width: 480px; margin: 0 auto; border-radius: 18px 18px 0 0; padding: 18px 18px 22px; }
.pillarql-title { font-family: "Source Serif 4", serif; font-size: 15px; margin-bottom: 2px; }
.pillarql-sub { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
.pillarql-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.pillarql-chip { font-size: 12px; font-weight: 700; padding: 9px 14px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; cursor: pointer; }
.pillarql-chip.add { border-style: dashed; border-color: var(--accent); color: var(--accent-dark); }
.pillarql-skip { display: block; width: 100%; text-align: center; background: none; border: none; font-family: inherit; font-size: 11.5px; font-weight: 700; color: var(--accent-dark); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding-top: 2px; }

/* "What did you do" field under a Yes pillar — Today's card and the day
   editor both use this, so a same-day log and a later correction get
   the same level of detail. */
.wde-activity-wrap { margin-top: 2px; }
.wde-activity-wrap input { width: 100%; box-sizing: border-box; font-size: 12.5px; padding: 7px 9px; }

.settings-note { font-size: 11px; color: var(--muted); background: var(--bg); border: 1px dashed var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 12px; line-height: 1.5; }

/* ---------- Pillar trends (Wellness page) ---------- */
.trend-title { font-size: 12.5px; font-weight: 700; margin-bottom: 2px; }
.trend-sub { font-size: 10.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }

/* Headline insight banner — one plain-language sentence about the
   strongest pillar, instead of leading with raw grids. */
.trend-insight-banner { background: linear-gradient(135deg, #F3E7D2, #EFE0C4); border: 1px solid #E3D1AC; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; display: flex; gap: 12px; align-items: flex-start; }
html[data-app-theme="dark"] .trend-insight-banner { background: linear-gradient(135deg, #3A3324, #2E2A1E); border-color: #4A4230; }
.trend-insight-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 1px solid #E3D1AC; color: var(--accent-dark); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.grace-banner .grace-icon {
  width: 40px; height: 40px; border: none; color: #fff;
  background: linear-gradient(145deg, #DCC9A6, #B98F58);
  box-shadow: 0 3px 8px rgba(124,92,54,.35), inset 0 1px 1px rgba(255,255,255,.4);
}
.grace-banner .grace-icon svg { width: 19px; height: 19px; }
.trend-insight-text { font-size: 13.5px; line-height: 1.45; padding-top: 3px; }
.trend-insight-text strong { color: var(--accent-dark); }
.insight-hero-eyebrow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-dark); margin-bottom: 3px; }

/* "Days you showed up" pulse chart — one line instead of five rows of squares. */
.pulse-card { margin-bottom: 14px; }
.pulse-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.pulse-head .t { font-size: 14px; font-weight: 600; }
.pulse-head .n { font-size: 12px; color: var(--muted); }

/* Per-pillar streaks, one full-width row each — always reads evenly
   regardless of how many pillars there are, unlike a 2-up grid with an
   odd one left stranded alone on its own row. */
.streak-chip-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.streak-chip { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.sc-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.sc-label { font-size: 13px; font-weight: 500; width: 108px; flex-shrink: 0; }
.sc-mini { display: flex; gap: 2.5px; flex: 1; }
.sc-mini i { width: 100%; height: 14px; border-radius: 3px; background: var(--bg); border: 1px solid var(--border); display: block; }
.sc-mini i.on { border: none; }
.sc-streak { font-size: 12.5px; font-weight: 600; color: var(--accent-dark); white-space: nowrap; width: 30px; text-align: right; }

/* Between-pillar pattern card, styled as a quiet aside rather than a data table. */
.trend-pattern-card { background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: var(--muted); line-height: 1.5; font-style: italic; }
.trend-pattern-card b { color: var(--text); font-style: normal; }
.trend-pattern-card + .trend-pattern-card { margin-top: 8px; }
.trend-pattern-note { font-size: 10.5px; color: var(--muted); margin-top: 8px; font-style: italic; }

.field-info-btn {
  width: 15px; height: 15px; border-radius: 50%; border: none; background: none; padding: 0;
  display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; cursor: pointer;
}
.field-info-btn:hover { color: var(--accent-dark); }

.info-modal-box { width: 420px; }
.info-modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.info-modal-header h3 { margin: 0; }
.info-modal-close { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; }
.info-modal-body { margin-top: 6px; }

.wellness-editor-box { max-height: 85vh; overflow-y: auto; }
.wellness-history-edit-btn { font-size: 12px; padding: 4px 10px; width: auto; height: auto; border-radius: 7px; border: 1px solid var(--border); color: var(--muted); background: none; cursor: pointer; flex-shrink: 0; }
.wellness-history-edit-btn:hover { color: var(--accent-dark); border-color: var(--accent-dark); }

.example-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
.example-chip {
  display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--bg);
  border: 1px solid var(--border); font-size: 13px; color: var(--text);
}

.cycle-phase-track { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-bottom: 14px; }
.cycle-phase-seg { height: 100%; }
.cycle-phase-menstrual { background: #B3543E; }
.cycle-phase-follicular { background: #C98A4B; }
.cycle-phase-ovulatory { background: #6E9B6A; }
.cycle-phase-luteal { background: #5B7A93; }
.cycle-phase-cards { display: flex; flex-direction: column; gap: 12px; }
.cycle-phase-card { display: flex; align-items: flex-start; gap: 10px; }
.cycle-phase-card-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.cycle-phase-card-title { font-size: 13px; font-weight: 600; color: var(--text); }
.cycle-phase-card-desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
.cycle-phase-card-body { flex: 1; }
.cycle-phase-card.active { background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px; margin: -6px -10px 6px; }
/* Only present when this diagram is the actual logging control (the
   sheet, not the plain info popup) — the card itself is the tap target,
   so it needs to look and behave like one even without hover on touch. */
.cycle-phase-card.tappable { cursor: pointer; border-radius: 10px; padding: 8px 10px; margin: -8px -10px; -webkit-tap-highlight-color: transparent; }
.cycle-phase-card.tappable:active { background: var(--bg); }
.cycle-phase-card.tappable.active { background: var(--bg); border: 1.5px solid var(--border); margin: -8px -10px; }
.cycle-phase-card-tap { align-self: center; font-size: 10.5px; font-weight: 700; color: var(--accent-dark); white-space: nowrap; padding-left: 4px; }
.cycle-phase-card.active .cycle-phase-card-tap { color: var(--good); }
.cycle-sheet-box { max-height: 82vh; overflow-y: auto; }
.btn-danger { background: #B3543E; color: #fff; border: none; border-radius: 7px; padding: 9px 16px; font-size: 13px; font-weight: 600; }
.btn-danger:hover { background: #97402D; }

.checklist-item-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.checklist-item-row:last-child { border-bottom: none; }

/* ---------- Capsule Wardrobe ---------- */
.wardrobe-group { border-bottom: 1px solid var(--border); padding: 11px 0; }
.wardrobe-summary { display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; padding: 4px 0; }
.wardrobe-summary::-webkit-details-marker { display: none; }
.wardrobe-cat-title { font-weight: 600; font-size: 14px; }
.wardrobe-items { margin-top: 8px; }
.wardrobe-item { border-bottom: 1px solid var(--border); }
.wardrobe-item:last-child { border-bottom: none; }
.wardrobe-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; cursor: pointer; list-style: none; }
.wardrobe-row::-webkit-details-marker { display: none; }
.wardrobe-item-detail { display: flex; flex-direction: column; gap: 10px; padding: 2px 0 14px 0; animation: wi-detail-in 0.15s ease; }
@keyframes wi-detail-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
.wi-detail-photo-btn { display: block; width: 100%; padding: 0; border: none; background: none; cursor: pointer; position: relative; }
.wi-detail-photo { display: block; width: 100%; height: 220px; object-fit: contain; object-position: center; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
.wi-detail-photo-empty { display: flex; align-items: center; justify-content: center; height: 120px; color: var(--muted); border-radius: 10px; }
.wi-detail-photo-zoom { position: absolute; bottom: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; display: flex; align-items: center; justify-content: center; }
.photo-lightbox-overlay { background: rgba(0,0,0,0.86); display: flex; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
.photo-lightbox-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; cursor: default; }
.photo-lightbox-close { position: absolute; top: 18px; right: 18px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); color: #fff; }
.wi-detail-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.wi-detail-fact { display: flex; flex-direction: column; gap: 1px; }
.wi-detail-fact-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.wi-detail-fact-val { font-size: 13px; color: var(--text); }
.wi-detail-notes { font-size: 12.5px; color: var(--muted); font-style: italic; line-height: 1.4; }
.wi-detail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.wi-detail-actions .btn-ghost { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 7px 12px; }
.wi-swatch { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.14); }
.wi-thumb { width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0; object-fit: cover; border: 1px solid var(--border); }
.wi-body { flex: 1; min-width: 0; }
.wi-name { font-size: 13.5px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 5px; }
.wi-name.owned { text-decoration: line-through; color: var(--muted); }
.wi-link-icon { color: var(--accent-dark); flex-shrink: 0; display: inline-flex; }
.wi-link-icon:hover { color: var(--accent); }
.wi-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.wi-price { font-size: 12px; color: var(--muted); font-weight: 500; flex-shrink: 0; white-space: nowrap; }
.wardrobe-edit-btn { width: 26px; height: 26px; flex-shrink: 0; }
.wardrobe-chevron { color: var(--muted); flex-shrink: 0; display: inline-flex; transition: transform 0.15s ease; }
.wardrobe-item[open] .wardrobe-chevron { transform: rotate(180deg); }

/* ---------- Book List ---------- */
.learning-checkin-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 13px; border-radius: 12px; border: 1.5px dashed var(--accent); background: var(--bg); font-family: inherit; cursor: pointer; margin-bottom: 4px; text-align: left; }
.learning-checkin-row.done { border-style: solid; border-color: var(--good); background: #E4E9E0; }
.learning-checkin-check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; }
.learning-checkin-check.on { background: var(--good); border-color: var(--good); }
.learning-checkin-label { font-size: 13px; font-weight: 600; color: var(--accent-dark); }
.learning-checkin-row.done .learning-checkin-label { color: var(--good); }
.book-summary-strip { display: flex; gap: 8px; margin: 12px 0 14px; }
.book-summary-chip { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.book-summary-chip .num { font-size: 19px; font-weight: 700; }
.book-summary-chip .lbl { font-size: 11px; color: var(--muted); margin-top: 1px; }
.bk-rating-badge { font-size: 10.5px; color: var(--muted); text-align: right; line-height: 1.5; white-space: nowrap; }
.bk-rating-badge .stars { font-size: 11px; }
.book-search-wrap { position: relative; margin-bottom: 14px; }
.book-search-input { width: 100%; box-sizing: border-box; padding-right: 32px; }
.book-search-clear { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; }
.book-search-clear svg { width: 14px; height: 14px; }
.rl-search-wrap { position: relative; margin-bottom: 6px; }
.rl-search-input { width: 100%; box-sizing: border-box; }
.rl-search-empty { font-size: 12px; color: var(--muted); padding: 4px 2px; }
.rl-chapter-hint { font-size: 11px; line-height: 1.4; margin-top: -2px; }
.wardrobe-modal-box { width: 380px; max-height: 85vh; overflow-y: auto; }
.wardrobe-item-form { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.wardrobe-item-form input, .wardrobe-item-form select, .wardrobe-item-form textarea { width: 100%; box-sizing: border-box; margin-bottom: 6px; }
.wardrobe-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-ghost.danger { color: var(--danger); border-color: #E0B6A8; }
.btn-ghost.danger:hover { background: #F1DAD3; }

/* ---------- Connections Log ---------- */
.social-quicklog-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
.social-quicklog-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 4px; }
.social-chip { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 58px; background: none; border: none; font-family: inherit; cursor: pointer; padding: 0; }
.social-chip-avatar { width: 44px; height: 44px; border-radius: 50%; background: #EFE3CF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: var(--accent-dark); border: 2px solid transparent; position: relative; }
.social-chip-avatar.today { border-color: var(--good); background: #E9EEE6; }
.social-chip-avatar.due { border-color: var(--danger); }
.social-chip-dot { position: absolute; bottom: -2px; right: -2px; width: 15px; height: 15px; border-radius: 50%; background: var(--good); border: 2px solid var(--surface); display: flex; align-items: center; justify-content: center; color: #fff; }
.social-chip-dot svg { width: 8px; height: 8px; }
.social-chip-name { font-size: 9.5px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--text); }
.social-chip-add { background: transparent; border: 1.5px dashed var(--accent); color: var(--accent-dark); font-size: 18px; font-weight: 800; }
.social-quicklog-hint { font-size: 10.5px; color: var(--muted); margin-bottom: 14px; }

/* ---------- Prayer Log ---------- */
.prayer-quicklog-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
.prayer-quicklog-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.prayer-chip { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 60px; background: none; border: none; font-family: inherit; cursor: pointer; padding: 0; }
.prayer-chip-avatar { width: 46px; height: 46px; border-radius: 50%; background: #EFE3CF; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--accent-dark); border: 2px solid transparent; }
.prayer-chip:active .prayer-chip-avatar { border-color: var(--good); background: #E4E9E0; }
.prayer-chip-lbl { font-size: 10px; font-weight: 600; color: var(--muted); text-align: center; }
.prayer-note-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 12.5px; font-family: inherit; background: var(--bg); margin-bottom: 8px; }
.prayer-today-recap { font-size: 11.5px; color: var(--text); }
.prayer-today-recap.muted { color: var(--muted); }

/* ---------- Breathe ---------- */
.method-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.method-chip { flex: 1 1 auto; min-width: 118px; padding: 10px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; text-align: left; font-family: inherit; }
.method-chip .m-name { font-size: 12.5px; font-weight: 700; display: block; color: var(--text); }
.method-chip .m-sub { font-size: 10px; color: var(--muted); display: block; margin-top: 1px; }
.method-chip.sel { border-color: var(--accent-dark); background: rgba(169,128,79,0.1); }
.method-chip.sel .m-name { color: var(--accent-dark); }
.method-chip.ghost { opacity: 0.55; cursor: default; border-style: dashed; }
.dur-row { display: flex; gap: 8px; margin: 12px 0 4px; }
.dur-chip { flex: 1; padding: 9px 4px; text-align: center; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; font-family: inherit; }
.dur-chip.sel { border-color: var(--accent-dark); background: rgba(169,128,79,0.1); color: var(--accent-dark); }
.sound-row { display: flex; gap: 8px; margin: 4px 0 4px; }
.sound-chip { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); font-family: inherit; cursor: pointer; }
.sound-chip .s-name { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.sound-chip.sel { border-color: var(--accent-dark); background: rgba(169,128,79,0.1); }
.sound-chip.sel .s-name { color: var(--accent-dark); }
.sound-chip .s-preview { width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted); flex-shrink: 0; }
.breathe-stage { display: flex; flex-direction: column; align-items: center; padding: 18px 0 6px; }
.breathe-ring-wrap { position: relative; width: 176px; height: 176px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
.breathe-track { position: absolute; inset: 0; border-radius: 50%; border: 2px dashed var(--border); }
.breathe-circle {
  width: 92px; height: 92px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #E7C892, var(--accent) 75%);
  box-shadow: 0 6px 18px rgba(124,92,54,0.28);
  transition: transform 4s ease-in-out;
  transform: scale(0.62);
  display: flex; align-items: center; justify-content: center;
}
.breathe-circle.grown { transform: scale(1); }
.breathe-circle.slow-style { background: radial-gradient(circle at 40% 30%, #DCE9D8, var(--good) 85%); box-shadow: 0 6px 18px rgba(85,105,74,0.25); }
.breathe-phase-label { font-family: "Source Serif 4", Georgia, serif; font-size: 15px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.15); }
.breathe-btn-row { display: flex; gap: 8px; }
.breathe-start-btn { flex: 1; padding: 12px; border-radius: 10px; background: var(--accent-dark); color: #fff; border: none; text-align: center; font-size: 13.5px; font-weight: 600; font-family: inherit; cursor: pointer; }
.breathe-start-btn:disabled { opacity: 0.7; cursor: default; }
.breathe-sound-btn { width: 46px; flex-shrink: 0; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; cursor: pointer; }
.breathe-sound-btn.muted { opacity: 0.5; }
.breathe-start-btn.stop { background: var(--danger); }
.method-row.disabled .method-chip:not(.ghost), .dur-row.disabled .dur-chip { opacity: 0.55; cursor: default; }
.breathe-complete { text-align: center; padding: 6px 0 4px; }
.breathe-complete .check { font-size: 28px; margin-bottom: 6px; }
.breathe-complete .msg { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.breathe-note-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 13px; font-family: inherit; margin: 10px 0 2px; background: var(--bg); }
.save-session-btn { width: 100%; padding: 11px; border-radius: 10px; background: var(--accent-dark); color: #fff; border: none; font-size: 13px; font-weight: 600; font-family: inherit; margin-top: 10px; cursor: pointer; }
.social-nudge-card { background: #FBF0EA; border: 1px solid #EAD3C4; border-radius: 12px; padding: 11px 12px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.social-nudge-icon { font-size: 16px; flex-shrink: 0; }
.social-nudge-text { font-size: 11.5px; line-height: 1.4; flex: 1; }
.social-nudge-text strong { color: var(--danger); }
.social-nudge-btn { flex-shrink: 0; font-size: 10.5px; font-weight: 700; color: var(--accent-dark); background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 6px 11px; font-family: inherit; cursor: pointer; }
.social-circle-title { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 12px 0 4px; }
.social-circle-avatar { width: 32px; height: 32px; border-radius: 50%; background: #EFE3CF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: var(--accent-dark); flex-shrink: 0; }
.social-circle-badge { font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 100px; flex-shrink: 0; white-space: nowrap; background: var(--bg); color: var(--muted); }
.social-circle-badge.good { background: #E9EEE6; color: var(--good); }
.social-circle-badge.warn { background: #FBF0EA; color: var(--danger); }
.social-history-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); }
.social-history-row:first-child { border-top: none; }
.social-history-kind { font-size: 12.5px; font-weight: 600; }
.social-history-date { font-size: 11px; color: var(--muted); margin-top: 1px; }
.social-history-actions { flex-shrink: 0; }
.mp-kind-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.mp-kind { font-size: 10.5px; font-weight: 700; padding: 7px 11px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; cursor: pointer; }
.mp-kind.sel { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }

/* ---------- Activity Log ---------- */
.al-card-title { font-weight: 700; font-size: 13.5px; margin-bottom: 10px; }
.al-note-line { font-size: 10.5px; color: var(--muted); margin-top: 8px; }
.sc-f-date-fixed { font-size: 13px; color: var(--muted); padding: 8px 0; }

.al-summary-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.al-summary-label { font-size: 12px; font-weight: 700; }
.al-summary-count { font-size: 12px; font-weight: 700; color: var(--accent-dark); }
.al-goal-edit { text-decoration: underline dotted; text-underline-offset: 2px; cursor: pointer; }
.al-bar { height: 8px; border-radius: 5px; background: var(--border); overflow: hidden; }
.al-bar-fill { height: 100%; background: var(--accent-dark); border-radius: 5px; }

.al-streak-chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 100px; background: #FBF3E4; border: 1px solid #EBD8AE; width: fit-content; }
.al-streak-chip .num { font-size: 14px; font-weight: 800; color: var(--accent-dark); }
.al-streak-chip .lbl { font-size: 10px; color: var(--muted); font-weight: 600; }

.al-chip-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.al-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 10.5px; font-weight: 600; color: var(--muted); font-family: inherit; cursor: pointer; }
.al-chip .em { font-size: 18px; }
.al-chip.active { border-color: var(--accent); background: #F3E9DA; color: var(--accent-dark); }
.al-chip-add { border-style: dashed; border-color: var(--accent); color: var(--accent-dark); background: #FBF7EF; }

.al-add-box { border: 1px dashed var(--accent); border-radius: 10px; padding: 12px; margin-bottom: 14px; background: #FBF7EF; }
.al-add-box input[type="text"] { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 9px; font-size: 13px; font-family: inherit; margin-top: 4px; }
.al-icon-swatch-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; margin-bottom: 8px; }
.al-icon-swatch { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit; }
.al-icon-swatch.sel { border: 2px solid var(--accent); }
.al-add-emoji { width: 44px !important; height: 40px; text-align: center; font-size: 18px; margin-top: 4px; }
.al-add-hint { font-size: 10.5px; color: var(--muted); margin: 6px 0 10px; }

.al-field-row { display: flex; gap: 10px; margin-bottom: 10px; }
.al-field { flex: 1; }
.al-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.al-field input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 9px; font-size: 13px; font-family: inherit; }
.al-save-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit; }

.al-hist-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; width: 100%; background: none; border-left: none; border-right: none; border-top: none; text-align: left; cursor: pointer; font-family: inherit; }
.al-hist-row:last-child { border-bottom: none; }
.al-hist-icon { width: 30px; height: 30px; border-radius: 50%; background: #F3E9DA; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.al-hist-main { flex: 1; display: flex; flex-direction: column; }
.al-hist-type { font-weight: 600; color: var(--text); }
.al-hist-meta { color: var(--muted); font-size: 11.5px; }
.al-hist-date { color: var(--muted); font-size: 11px; white-space: nowrap; }

.al-mix-wrap { display: flex; align-items: center; gap: 18px; }
.al-donut { width: 92px; height: 92px; border-radius: 50%; flex-shrink: 0; }
.al-legend { flex: 1; font-size: 12px; }
.al-legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.al-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.al-legend-pct { margin-left: auto; font-weight: 600; color: var(--accent-dark); }

/* Milestones — shared across every ongoing practice (Activity Log, Meal
   Log, Workout Log, Connections, Book List) so the badge grid looks and
   sits identically no matter what it's actually counting. Wide 2-column
   layout with the medal beside the text, not stacked above it, so a
   longer label never wraps into a cramped stack of lines. */
.pr-badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pr-badge { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); }
.pr-badge-medal { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; position: relative; }
.pr-badge-medal.earned { background: radial-gradient(circle at 35% 30%, #F5D28A, #C6883F 70%); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5), 0 2px 6px rgba(124,92,54,0.35); }
.pr-badge-medal-inner { position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.pr-badge-text { flex: 1; min-width: 0; }
.pr-badge-text .lbl { font-size: 11.5px; font-weight: 700; line-height: 1.25; }
.pr-badge-text .sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
.pr-badge-text .sub.earned-date { color: var(--accent-dark); font-weight: 600; }

/* ---------- Meal Log ---------- */
.ml-lib-note { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin: 0 0 12px; }
.ml-lib-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.ml-lib-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; background: var(--bg); border: 1.5px solid var(--border); cursor: pointer; }
.ml-lib-item.selected { border-color: var(--accent-dark); background: rgba(169,128,79,0.08); }
.ml-lib-item.improv { font-style: italic; color: var(--muted); }
.ml-lib-recent-badge { font-size: 8.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--good); background: #E4E9E0; padding: 3px 7px; border-radius: 20px; flex-shrink: 0; white-space: nowrap; }
.ml-current-pick { font-size: 11.5px; color: var(--muted); margin: -2px 0 10px; }
.ml-current-pick strong { color: var(--text); font-weight: 600; }
.ml-lib-thumb { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--border); }
.ml-lib-main { flex: 1; min-width: 0; }
.ml-lib-text { font-size: 13px; display: block; }
.ml-lib-tag { display: inline-block; font-size: 13px; margin-left: 6px; vertical-align: -1px; opacity: .85; }
.ml-lib-link { display: block; font-size: 10.5px; color: var(--accent-dark); text-decoration: none; margin-top: 1px; }
.ml-lib-remove { flex-shrink: 0; width: 26px; height: 26px; }
.ml-lib-add-row { display: flex; gap: 8px; margin-bottom: 8px; }
.ml-lib-add-name { flex: 1; padding: 9px 10px; border: 1px dashed var(--border); border-radius: 9px; font-size: 12.5px; font-family: inherit; background: var(--bg); }
.ml-lib-add-btn { padding: 9px 14px; border-radius: 9px; border: none; background: var(--accent-dark); color: #fff; font-weight: 600; font-size: 12.5px; font-family: inherit; }
.ml-lib-extras-row { display: flex; gap: 8px; }
.ml-lib-extra-btn { flex: 1; padding: 7px; border-radius: 8px; border: 1px dashed var(--border); background: transparent; color: var(--muted); font-size: 11.5px; font-family: inherit; }
.ml-lib-tag-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
.ml-lib-add-link { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--border); border-radius: 9px; font-size: 12.5px; font-family: inherit; background: var(--bg); margin-top: 10px; }
.ml-lib-photo-note { font-size: 11px; color: var(--good); margin-top: 8px; }

.ml-today-recap { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* Log a meal — meal type and quality are both single compact rows with no
